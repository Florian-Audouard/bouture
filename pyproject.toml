[project]
name = "bouture"
version = "0.2.0"
description = "Agents LLM à sessions versionnées (fork, rollback) persistées en Postgres ou SQLite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
litellm = ["litellm>=1.60"]
fastapi = ["fastapi>=0.110"]
asyncpg = ["asyncpg>=0.29"]
psycopg = ["psycopg[binary]>=3.1"]
claude-code = ["claude-agent-sdk>=0.2.168"]
sqlite = [
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "fastapi>=0.110",
    "asyncpg>=0.29",
    "uvicorn>=0.30",
    "litellm>=1.60",
    "claude-agent-sdk>=0.2.168",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bouture"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# E501 : le formateur gère le code ; ASYNC109 : `timeout=` fait partie de l'API (shutdown, join).
ignore = ["E501", "ASYNC109"]

[tool.pyright]
include = ["src", "examples", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
